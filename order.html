<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สั่งวัตถุดิบ - ฝั่งสาขา</title>
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            padding: 20px;
            max-width: 420px;
            margin: auto;
            background-color: #f8f9fa;
        }
        .container {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h2 { text-align: center; color: #333; }
        .item { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #555;}
        input[type="number"], input[type="text"], select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        .section-label { font-size: 13px; font-weight: 700; color: #94a3b8; margin: 18px 0 8px; text-transform: none; }
        .section-title { color: white; padding: 10px 15px; border-radius: 8px; margin: 20px 0 12px; font-size: 16px; font-weight: 700; }
        .section-title.food { background-color: #1e293b; }
        .section-title.drink { background-color: #92400e; }
        .section-title.supplies { background-color: #0f766e; }
        .section-title.veg { background-color: #15803d; }
        .section-title.seasoning { background-color: #0369a1; }
        .section-title.bbq { background-color: #a16207; }
        .section-title.dessert { background-color: #be185d; }
        .section-title.krapao { background-color: #b91c1c; }
        button {
            width: 100%;
            padding: 12px;
            background-color: #06C755; /* สีเขียว LINE */
            color: white;
            border: none;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 10px;
        }
        button:hover { background-color: #05a546; }
        button:disabled { background-color: #9bd8b5; cursor: not-allowed; }
        .section-title.note { background-color: #475569; }

        /* แถวสินค้า: ชื่อซ้าย / ปุ่ม − ช่อง + หน่วย ขวา */
        .qty-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 6px; border-bottom: 1px solid #f1f5f9; border-radius: 6px; }
        .qty-row.has-qty { background: #fef9c3; }
        .qty-name { flex: 1; min-width: 0; font-weight: 600; color: #334155; font-size: 15px; }
        .qty-name .num { color: #94a3b8; font-weight: 400; margin-right: 2px; }
        .stepper { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
        .stepper button { width: 36px; height: 36px; margin: 0; padding: 0; font-size: 20px; line-height: 1; border-radius: 8px; background: #e2e8f0; color: #0f172a; }
        .stepper button:hover { background: #cbd5e1; }
        .stepper input.qty-input { width: 58px; padding: 6px 2px; text-align: center; font-size: 16px; }
        .unit { width: 40px; font-size: 13px; color: #64748b; }
        textarea#orderNote { width: 100%; box-sizing: border-box; min-height: 80px; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; font-family: inherit; }
        .note-hint { font-size: 13px; color: #64748b; margin: -4px 0 8px; }

        /* หน้ายืนยันก่อนส่ง */
        .confirm-backdrop { position: fixed; inset: 0; background: rgba(15,23,42,0.55); display: none; align-items: center; justify-content: center; padding: 15px; z-index: 50; }
        .confirm-box { background: white; border-radius: 14px; width: 100%; max-width: 420px; max-height: 90vh; display: flex; flex-direction: column; }
        .confirm-head { padding: 16px 18px 8px; }
        .confirm-head h3 { margin: 0 0 6px; font-size: 18px; color: #0f172a; }
        .confirm-meta { font-size: 14px; color: #334155; line-height: 1.6; }
        .confirm-body { overflow-y: auto; padding: 4px 18px; flex: 1; }
        .confirm-sec { font-size: 13px; font-weight: 700; color: #64748b; margin: 10px 0 4px; }
        .confirm-line { display: flex; justify-content: space-between; font-size: 15px; padding: 4px 0; border-bottom: 1px dashed #e2e8f0; }
        .confirm-line b { white-space: nowrap; margin-left: 8px; }
        .confirm-note { background: #f1f5f9; border-radius: 8px; padding: 8px 10px; font-size: 14px; white-space: pre-wrap; margin-top: 4px; }
        .confirm-actions { display: flex; gap: 10px; padding: 14px 18px 18px; }
        .confirm-actions button { margin: 0; }
        .btn-back { background: #e2e8f0 !important; color: #334155 !important; flex: 0 0 100px; }
        .back-link { display: block; text-align: center; margin-top: 15px; color: #64748b; font-size: 14px; text-decoration: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>ฟอร์มสั่งของเข้าสาขา</h2>
    <form id="orderForm">
        <div class="item">
            <label>ชื่อสาขา:</label>
            <select id="branchName" required>
                <option value="" disabled selected>-- เลือกสาขา --</option>
                <option value="ห้วยขวาง">ห้วยขวาง</option>
                <option value="ประชาราษฎร์บำเพ็ญ">ประชาราษฎร์บำเพ็ญ</option>
            </select>
        </div>

        <div class="item">
            <label>รอบส่ง:</label>
            <select id="deliveryRound" required>
                <option value="" disabled selected>-- เลือกรอบส่ง --</option>
                <option value="ส่งด่วน">🚨 1. ส่งด่วน (ของหมด)</option>
                <option value="ภายใน 2 ชม.">⏱️ 2. ส่งภายใน 2 ชั่วโมง (ของกำลังจะหมด)</option>
                <option value="ส่งเช้า">🌅 3. ส่งเช้า</option>
                <option value="ส่งเย็น">🌇 4. ส่งเย็น</option>
            </select>
        </div>

        <h3 class="section-title food">🍜 ก๋วยเตี๋ยว</h3>
        <div id="foodItemsContainer"></div>

        <h3 class="section-title veg">🥬 ผักก๋วยเตี๋ยว</h3>
        <div id="vegItemsContainer"></div>

        <h3 class="section-title seasoning">🧂 เครื่องปรุงก๋วยเตี๋ยว</h3>
        <div id="seasoningItemsContainer"></div>

        <h3 class="section-title bbq">🥘 ผักหมูกระทะ</h3>
        <div id="bbqItemsContainer"></div>

        <h3 class="section-title dessert">🍮 ขนม</h3>
        <div id="dessertItemsContainer"></div>

        <h3 class="section-title krapao">🌿 ผัดกะเพรา</h3>
        <div id="krapaoItemsContainer"></div>

        <h3 class="section-title drink">🧋 ชานม กัตโตะชา</h3>
        <div id="drinkItemsContainer"></div>

        <h3 class="section-title supplies">🛍️ ของใช้ทั่วไป</h3>
        <div id="suppliesItemsContainer"></div>

        <h3 class="section-title note">📝 สั่งเพิ่ม (ของที่ไม่มีในรายการ)</h3>
        <div class="note-hint">พิมพ์ชื่อของ + จำนวน + หน่วย บรรทัดละรายการ — ไม่ต้องสั่งทางแชทแล้ว</div>
        <textarea id="orderNote" placeholder="เช่น&#10;โหระพา ครึ่งโล&#10;ใบเตย 40 บาท"></textarea>

        <button type="submit" id="reviewBtn">ตรวจสอบออเดอร์</button>
    </form>
    <a class="back-link" href="index.html">&larr; กลับหน้ารวม</a>
</div>

<div class="confirm-backdrop" id="confirmModal">
    <div class="confirm-box">
        <div class="confirm-head">
            <h3>ตรวจสอบก่อนส่ง</h3>
            <div class="confirm-meta" id="confirmMeta"></div>
        </div>
        <div class="confirm-body" id="confirmBody"></div>
        <div class="confirm-actions">
            <button type="button" class="btn-back" onclick="closeConfirm()">← แก้ไข</button>
            <button type="button" id="submitBtn" onclick="submitOrder()">✅ ยืนยันส่งออเดอร์</button>
        </div>
    </div>
</div>

<script>
    // นำ URL ที่ก็อปปี้จาก Apps Script Deployment มาใส่ตรงนี้ (ใช้ URL เดียวกันทั้ง 3 หน้า)
    const API_URL = "https://script.google.com/macros/s/AKfycbw5R3G6R0UUqwazm95-P6TlaTu_qCm5ztYmjyc1QjYd7SdTLNjAF2PF9xIxlgkB2al-/exec";

    // รายการที่สาขาสั่งได้ — เพิ่ม/ลบ/แก้รายการใหม่ได้ที่นี่ที่เดียว ไม่ต้องแก้ HTML ส่วนอื่น
    const ORDER_ITEMS = [
        { section: 'food', name: 'กากหมูเจียว (กล่อง)' },
        { section: 'food', name: 'แคบหมู (ห่อ)' },
        { section: 'food', name: 'หมูหมัก' },
        { section: 'food', name: 'ตับหมูสไลด์' },
        { section: 'food', name: 'หมูตุ๋น' },
        { section: 'food', name: 'เนื้อหมัก' },
        { section: 'food', name: 'ตับวัวสไลด์' },
        { section: 'food', name: 'เนื้อเปื่อย' },
        { section: 'food', name: 'ขาตั้งหมู' },
        { section: 'food', name: 'ลูกชิ้นหมู (ถุง)' },
        { section: 'food', name: 'ลูกชิ้นเนื้อวัว (ถุง)' },
        { section: 'food', name: 'เลือดหมู (ถุง)' },
        { section: 'veg', name: 'ผักบุ้งไทย' },
        { section: 'veg', name: 'ถั่วงอก' },
        { section: 'veg', name: 'ผักชีฝรั่ง' },
        { section: 'veg', name: 'ผักชีไทย' },
        { section: 'veg', name: 'มะนาว (โล)' },
        { section: 'veg', name: 'โหระพา (โล)' },
        { section: 'veg', name: 'ใบเตย (บาท)' },
        { section: 'seasoning', name: 'น้ำปลา (แกลลอน)' },
        { section: 'seasoning', name: 'น้ำส้ม (แกลลอน)' },
        { section: 'seasoning', name: 'พริกป่น ก๋วยเตี๋ยว (ถุง)' },
        { section: 'seasoning', name: 'น้ำตาลทรายลิน (ถุง)' },
        { section: 'seasoning', name: 'เส้นเล็ก (ห่อ)' },
        { section: 'seasoning', name: 'บะหมี่เหลือง (ห่อ)' },
        { section: 'seasoning', name: 'หมี่ขาว (ห่อ)' },
        { section: 'seasoning', name: 'วุ้นเส้น (ห่อ)' },
        { section: 'seasoning', name: 'ถั่วป่น (ถุง)' },
        { section: 'seasoning', name: 'ผงชูรสตราช้อน (ถุง)' },
        { section: 'bbq', name: 'เห็ดเข็มทอง (ถุง)' },
        { section: 'bbq', name: 'ผักกาดขาว (โล)' },
        { section: 'bbq', name: 'ผักบุ้งจีน (โล)' },
        { section: 'dessert', name: 'ขนมถ้วย' },
        { section: 'krapao', name: 'หมูหมัก ผัดกะเพรา' },
        { section: 'krapao', name: 'หมูกรอบ (แผ่น)' },
        { section: 'krapao', name: 'น้ำมันหมู' },
        { section: 'krapao', name: 'เป็ดย่าง' },
        { section: 'krapao', name: 'หมูสับ' },
        { section: 'krapao', name: 'เนื้อสับ' },
        { section: 'krapao', name: 'กุ้งสับ' },
        { section: 'krapao', name: 'ไก่ชิ้น' },
        { section: 'drink', name: 'ชานม (แกลลอน)' },
        { section: 'drink', name: 'ชาเขียวใส (แกลลอน)' },
        { section: 'drink', name: 'ชาไทย (แกลลอน)' },
        { section: 'drink', name: 'ชาเขียวนม (แกลลอน)' },
        { section: 'drink', name: 'กาแฟ (แกลลอน)' },
        { section: 'drink', name: 'ชานม (ขวด)' },
        { section: 'drink', name: 'ชาเขียวใส (ขวด)' },
        { section: 'drink', name: 'ชาไทย (ขวด)' },
        { section: 'drink', name: 'ชาเขียวนม (ขวด)' },
        { section: 'drink', name: 'กาแฟ (ขวด)' },
        { section: 'drink', name: 'ไข่มุก (ถุง)' },
        { section: 'supplies', name: 'ถุงร้อน 6x9' },
        { section: 'supplies', name: 'ถุงหิ้ว 7x15' },
        { section: 'supplies', name: 'ถุงหิ้ว 8x16' },
        { section: 'supplies', name: 'ถุงหิ้ว 9x18' },
        { section: 'supplies', name: 'ถุงหิ้ว 12x20' },
        { section: 'supplies', name: 'ตะเกียบ' },
        { section: 'supplies', name: 'ช้อนสั้น' },
        { section: 'supplies', name: 'ถุงแพ็คหมู 4.5x7' },
        { section: 'supplies', name: 'ถุงซิปน้ำปลา 5x7' },
        { section: 'supplies', name: 'ถ้วยคราฟ 750ml' }
    ];

    const SECTION_LABELS = {
        food: '🍜 ก๋วยเตี๋ยว', veg: '🥬 ผักก๋วยเตี๋ยว', seasoning: '🧂 เครื่องปรุงก๋วยเตี๋ยว', bbq: '🥘 ผักหมูกระทะ',
        dessert: '🍮 ขนม', krapao: '🌿 ผัดกะเพรา', drink: '🧋 ชานม กัตโตะชา', supplies: '🛍️ ของใช้ทั่วไป'
    };

    // แยกหน่วยจากวงเล็บท้ายชื่อ เช่น "ผักบุ้งจีน (โล)" -> { base: "ผักบุ้งจีน", unit: "โล" }
    // ชื่อเต็ม (รวมวงเล็บ) ยังเป็นค่าที่ส่งเข้าระบบเหมือนเดิม เพื่อให้ตัดสต๊อก/Agent จับคู่ได้
    function splitUnit(name) {
        const m = name.match(/^(.*?)\s*\(([^()]+)\)\s*$/);
        return m ? { base: m[1], unit: m[2] } : { base: name, unit: '' };
    }
    // ปุ่ม +/- กดทีละเท่าไร: ของชั่งกิโล ทีละครึ่ง, ของที่สั่งเป็นเงิน ทีละ 10 บาท, อื่นๆ ทีละ 1
    function stepFor(unit) {
        if (/^(โล|กก\.?|กิโล)$/.test(unit)) return 0.5;
        if (unit === 'บาท') return 10;
        return 1;
    }
    function r3(n) { return Math.round(n * 1000) / 1000; }
    function esc(t) { const d = document.createElement('div'); d.textContent = String(t); return d.innerHTML; }

    function buildItemInputs() {
        ORDER_ITEMS.forEach(function (item, idx) {
            const u = splitUnit(item.name);
            const step = stepFor(u.unit);
            const row = document.createElement('div');
            row.className = 'qty-row';
            row.innerHTML =
                '<div class="qty-name"><span class="num">' + (idx + 1) + '.</span> ' + esc(u.base) + '</div>' +
                '<div class="stepper">' +
                    '<button type="button" class="minus" aria-label="ลด">−</button>' +
                    '<input type="number" class="qty-input" min="0" step="any" inputmode="decimal" value="0">' +
                    '<button type="button" class="plus" aria-label="เพิ่ม">+</button>' +
                    '<span class="unit">' + esc(u.unit) + '</span>' +
                '</div>';
            const input = row.querySelector('.qty-input');
            input.dataset.name = item.name;  // ชื่อเต็มที่ส่งเข้าระบบ
            input.dataset.idx = idx;
            row.querySelector('.minus').addEventListener('click', function () {
                input.value = Math.max(0, r3((parseFloat(input.value) || 0) - step)); onQtyChange(input);
            });
            row.querySelector('.plus').addEventListener('click', function () {
                input.value = r3((parseFloat(input.value) || 0) + step); onQtyChange(input);
            });
            input.addEventListener('input', function () { onQtyChange(input); });
            input.addEventListener('focus', function () { if (input.value === '0') input.select(); });
            document.getElementById(item.section + 'ItemsContainer').appendChild(row);
        });
    }

    function onQtyChange(input) {
        input.closest('.qty-row').classList.toggle('has-qty', (parseFloat(input.value) || 0) > 0);
        updateReviewButton();
    }

    function collectItems() {
        const items = [];
        document.querySelectorAll('.qty-input').forEach(function (input) {
            const qty = r3(parseFloat(input.value) || 0); // รองรับครึ่งโล (0.5)
            if (qty > 0) items.push({ name: input.dataset.name, qty: qty, idx: Number(input.dataset.idx) });
        });
        return items;
    }

    function updateReviewButton() {
        const n = collectItems().length;
        const hasNote = document.getElementById('orderNote').value.trim() !== '';
        document.getElementById('reviewBtn').textContent =
            'ตรวจสอบออเดอร์' + (n ? ' (' + n + ' รายการ' + (hasNote ? ' + สั่งเพิ่ม' : '') + ')' : (hasNote ? ' (สั่งเพิ่ม)' : ''));
    }

    let pendingOrder = null;

    // ขั้นที่ 1: กด "ตรวจสอบออเดอร์" -> สรุปให้ดูก่อน (form จะเช็คสาขา/รอบส่งให้ก่อนถึงตรงนี้)
    document.getElementById('orderForm').addEventListener('submit', function (e) {
        e.preventDefault();
        const items = collectItems();
        const note = document.getElementById('orderNote').value.trim();
        if (items.length === 0 && !note) {
            alert('กรุณาใส่จำนวนอย่างน้อย 1 รายการ หรือพิมพ์ในช่อง "สั่งเพิ่ม"');
            return;
        }
        pendingOrder = {
            action: 'submitOrder',
            branch: document.getElementById('branchName').value,
            deliveryRound: document.getElementById('deliveryRound').value,
            items: items.map(function (i) { return { name: i.name, qty: i.qty }; }),
            note: note
        };

        const roundSel = document.getElementById('deliveryRound');
        document.getElementById('confirmMeta').innerHTML =
            'สาขา: <b>' + esc(pendingOrder.branch) + '</b><br>รอบส่ง: <b>' + esc(roundSel.options[roundSel.selectedIndex].text) + '</b>';

        let html = '';
        let lastSection = null;
        items.forEach(function (i) {
            const sec = ORDER_ITEMS[i.idx].section;
            if (sec !== lastSection) { html += '<div class="confirm-sec">' + esc(SECTION_LABELS[sec] || sec) + '</div>'; lastSection = sec; }
            const u = splitUnit(i.name);
            html += '<div class="confirm-line"><span>' + esc(u.base) + '</span><b>' + i.qty + (u.unit ? ' ' + esc(u.unit) : '') + '</b></div>';
        });
        if (note) html += '<div class="confirm-sec">📝 สั่งเพิ่ม</div><div class="confirm-note">' + esc(note) + '</div>';
        document.getElementById('confirmBody').innerHTML = html;

        const btn = document.getElementById('submitBtn');
        btn.disabled = false;
        btn.textContent = '✅ ยืนยันส่งออเดอร์';
        document.getElementById('confirmModal').style.display = 'flex';
    });

    function closeConfirm() {
        document.getElementById('confirmModal').style.display = 'none';
    }

    // ขั้นที่ 2: ยืนยัน -> ส่งเข้าระบบ
    function submitOrder() {
        if (!pendingOrder) return;
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.textContent = 'กำลังส่ง...';
        pendingOrder.timestamp = new Date().toISOString();

        fetch(API_URL, {
            method: 'POST',
            mode: 'no-cors', // สำคัญ: ป้องกันปัญหาการข้ามโดเมน (CORS) — จะอ่าน response ไม่ได้ แต่ยิงข้อมูลได้ปกติ
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(pendingOrder)
        }).then(function () {
            alert('ส่งออเดอร์ของ ' + pendingOrder.branch + ' เรียบร้อยแล้ว!');
            closeConfirm();
            document.getElementById('orderForm').reset();
            document.querySelectorAll('.qty-row.has-qty').forEach(function (r) { r.classList.remove('has-qty'); });
            updateReviewButton();
            pendingOrder = null;
            window.scrollTo(0, 0);
        }).catch(function () {
            alert('เกิดข้อผิดพลาดในการส่ง กรุณาลองใหม่');
            btn.disabled = false;
            btn.textContent = '✅ ยืนยันส่งออเดอร์';
        });
    }

    document.getElementById('orderNote').addEventListener('input', updateReviewButton);
    buildItemInputs();
</script>

</body>
</html>
